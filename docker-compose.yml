#winitech eco system
version: "3.8"

services:
  shop-api:
    image: docker.io/winitechvina/shop-api:latest
    container_name: shop-api
    ports:
      - "7101:7101"
      - "7100:7100"
    volumes:
      - shop-api:/shop-api

  shop-web:
    image: docker.io/winitechvina/shop-web:latest
    container_name: shop-web
    ports:
      - "5000:443"
    volumes:
      - shop-web:/usr/share/nginx/html
volumes:
  shop-api:
  shop-web: